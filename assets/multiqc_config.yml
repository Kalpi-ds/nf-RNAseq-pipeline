# multiqc_config.yml
# MultiQC configuration for RNAseq-pipeline
# See https://multiqc.info/docs/#configuring-multiqc

report_header_info:
    - Contact: "kdesilva@wi.mit.edu"
    - Pipeline: "RNAseq-pipeline v2.0"
    - Institution: "Whitehead Institute"

title: "RNAseq Pipeline QC Report"
subtitle: "Generated by RNAseq-pipeline v2.0"

# Order in which sections appear in the report
module_order:
    - fastqc
    - cutadapt
    - trim_galore
    - star
    - featurecounts

# Always show these columns in the General Statistics table
table_columns_visible:
    FastQC:
        percent_duplicates: true
        percent_gc: true
        avg_sequence_length: true
        percent_fails: false
        total_sequences: true
    STAR:
        uniquely_mapped_percent: true
        multimapped_percent: true
        unmapped_tooshort_percent: false
    featureCounts:
        Assigned: true
        Unassigned_NoFeatures: true

# Colour theme
custom_plot_config:
    general_stats_table:
        font_size: 9pt

# Skip empty / tiny sections
skip_generalstats: false
report_comment: "Automated QC report — review all samples before proceeding."
